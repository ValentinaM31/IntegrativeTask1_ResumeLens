<svg xmlns="http://www.w3.org/2000/svg" width="930" height="406" viewBox="0 0 930 406" role="img" aria-labelledby="title desc">
<title id="title">Git SCM to GIT: actual FST alias path</title>
<desc id="desc">One accepting path from the tools_qualifications machine. State names and all input/output labels are taken from its executable transitions. Other alias paths are omitted.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65538e"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#282338}.edge{fill:none;stroke:#65538e;stroke-width:2;marker-end:url(#arrow)}.state{stroke:#65538e;stroke-width:2;fill:#f4f0fb}.label{font-size:14px}.name{font-size:11px;text-anchor:middle}</style>
<text x="24" y="31" font-size="22" font-weight="bold">Git SCM → GIT</text>
<text x="24" y="57" font-size="13">Alias-path subset of tools_qualifications. Other branches are omitted.</text>
<text x="24" y="79" font-size="13">Input after separate casefold: git scm</text>
