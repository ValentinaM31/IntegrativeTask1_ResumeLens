[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "resumelens-first-stage"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["pyformlang==1.0.11"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
resumelens = ["*.json"]
