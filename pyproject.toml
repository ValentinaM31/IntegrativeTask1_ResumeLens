[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens-first-stage"
version = "1.4.0"
description = "ResumeLens formal-language processing with a local browser interface"
requires-python = ">=3.10"
dependencies = ["pyformlang==1.0.11", "jsonschema==4.26.0", "textX==4.4.0"]

[project.scripts]
resumelens = "resumelens.cli:main"
resumelens-workflow = "resumelens.workflow_cli:main"
resumelens-ui = "resumelens.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resumelens = ["*.json", "*.tx", "ui/*.html", "ui/*.css", "ui/*.js", "ui/*.txt"]
