[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens-first-stage"
version = "1.2.0"
description = "ResumeLens extraction, normalization, profile automata and candidate DSL"
requires-python = ">=3.10"
dependencies = ["pyformlang==1.0.11", "jsonschema==4.26.0", "textX==4.4.0"]

[project.scripts]
resumelens = "resumelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resumelens = ["*.json", "*.tx"]
